set timeout=3
set default=0

# Detect platform and use correct multiboot command
if [ "${grub_platform}" = "efi" ]; then
    # UEFI mode: GRUB EFI only supports multiboot2
    menuentry "Jarvis OS (UEFI)" {
        insmod all_video
        set gfxmode=1920x1080x32,1280x720x32,auto
        set gfxpayload=keep
        insmod gfxterm
        terminal_output gfxterm
        insmod multiboot2
        multiboot2 /boot/kernel.elf
        module2 /boot/brain.bin "ai_weights"
        boot
    }
else
    # BIOS/legacy mode: classic multiboot
    menuentry "Jarvis OS (BIOS)" {
        insmod all_video
        set gfxmode=auto
        set gfxpayload=keep
        insmod gfxterm
        terminal_output gfxterm
        insmod multiboot2
        multiboot2 /boot/kernel.elf
        module2 /boot/brain.bin "ai_weights"
        boot
    }
fi
